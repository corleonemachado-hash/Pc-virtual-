<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu PC Virtual</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #202124;
      color: white;
    }

    .desktop {
      height: 100vh;
      padding: 30px;
      background: linear-gradient(135deg, #172554, #111827, #312e81);
      position: relative;
    }

    .icon {
      width: 80px;
      text-align: center;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .icon-box {
      font-size: 42px;
    }

    .icon-name {
      font-size: 13px;
      margin-top: 5px;
    }

    .taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55px;
      background: rgba(20, 20, 20, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      backdrop-filter: blur(10px);
    }

    .start {
      font-size: 28px;
      cursor: pointer;
    }

    .clock {
      position: absolute;
      right: 20px;
      font-size: 14px;
    }

    .window {
      display: none;
      position: absolute;
      top: 15%;
      left: 10%;
      width: 80%;
      height: 60%;
      background: white;
      color: black;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 40px black;
    }

    .titlebar {
      height: 45px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .close {
      cursor: pointer;
      font-size: 22px;
    }

    .content {
      padding: 20px;
    }
  </style>
</head>

<body>
