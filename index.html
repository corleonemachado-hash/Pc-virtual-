
<div class="desktop">

  <div class="icon" onclick="openWindow('Meu Computador')">
    <div class="icon-box">💻</div>
    <div class="icon-name">Meu Computador</div>
  </div>

  <div class="icon" onclick="openWindow('Navegador')">
    <div class="icon-box">🌐</div>
    <div class="icon-name">Navegador</div>
  </div>

  <div class="icon" onclick="openWindow('Arquivos')">
    <div class="icon-box">📁</div>
    <div class="icon-name">Arquivos</div>
  </div>

  <div class="window" id="window">
    <div class="titlebar">
      <span id="windowTitle">PC Virtual</span>
      <span class="close" onclick="closeWindow()">✕</span>
    </div>

    <div class="content" id="windowContent">
      Bem-vindo ao seu PC virtual!
    </div>
  </div>

  <div class="taskbar">
    <div class="start" onclick="openWindow('Menu Iniciar')">⊞</div>
    <div class="clock" id="clock"></div>
  </div>

</div>

<script>
function openWindow(name) {
  document.getElementById("window").style.display = "block";
  document.getElementById("windowTitle").textContent = name;

  if (name === "Meu Computador") {
    document.getElementById("windowContent").innerHTML =
      "<h2>💻 Meu Computador</h2><p>Este é o seu PC virtual.</p>";
  }

  if (name === "Navegador") {
    document.getElementById("windowContent").innerHTML =
      "<h2>🌐 Navegador</h2><p>Seu navegador virtual está pronto.</p>";
  }

  if (name === "Arquivos") {
    document.getElementById("windowContent").innerHTML =
      "<h2>📁 Arquivos</h2><p>Nenhum arquivo ainda.</p>";
  }

  if (name === "Menu Iniciar") {
    document.getElementById("windowContent").innerHTML =
      "<h2>⊞ Menu Iniciar</h2><p>💻 Meu Computador</p><p>🌐 Navegador</p><p>📁 Arquivos</p>";
  }
}

function closeWindow() {
  document.getElementById("window").style.display = "none";
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
